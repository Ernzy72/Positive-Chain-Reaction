<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interactive Periodic Table</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    background: linear-gradient(135deg, #020617, #0f172a, #172554);
    background-size: 400% 400%;
    animation: background 15s ease infinite;
}

@keyframes background {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

header {
    text-align: center;
    padding: 25px 10px;
}

header h1 {
    color: #38bdf8;
    font-size: 40px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px #0284c7;
}

header p {
    color: #cbd5e1;
}

.search {
    text-align: center;
    margin-bottom: 25px;
}

#search {
    width: 90%;
    max-width: 600px;
    padding: 15px;
    border-radius: 30px;
    border: 2px solid #38bdf8;
    background: #020617;
    color: white;
    font-size: 16px;
    outline: none;
}

.table-container {
    width: 98%;
    margin: auto;
    overflow-x: auto;
}

.table {
    display: grid;
    grid-template-columns: repeat(18, 70px);
    grid-template-rows: repeat(9, 90px);
    gap: 5px;
    width: max-content;
    margin: auto;
}

.element {
    border-radius: 8px;
    padding: 5px;
    cursor: pointer;
    text-align: center;
    border: 1px solid rgba(255,255,255,.3);
    transition: .25s;
}

.element:hover {
    transform: scale(1.08);
    box-shadow: 0 0 20px #38bdf8;
    z-index: 5;
}

.number {
    font-size: 11px;
    text-align: left;
}

.symbol {
    font-size: 25px;
    font-weight: bold;
}

.name {
    font-size: 10px;
}

.mass {
    font-size: 9px;
    opacity: .8;
}

/* Element colors */

.alkali { background: #b91c1c; }
.alkaline { background: #c2410c; }
.transition { background: #1d4ed8; }
.post { background: #0891b2; }
.metalloid { background: #047857; }
.nonmetal { background: #15803d; }
.halogen { background: #7e22ce; }
.noble { background: #be185d; }
.lanthanide { background: #a16207; }
.actinide { background: #92400e; }

/* Details */

#details {
    display: none;
    width: 90%;
    max-width: 900px;
    margin: 35px auto;
    padding: 25px;
    border-radius: 20px;
    background: rgba(15,23,42,.95);
    border: 2px solid #38bdf8;
    box-shadow: 0 0 30px rgba(56,189,248,.3);
}

#details.show {
    display: block;
}

.close {
    float: right;
    background: #dc2626;
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
}

.element-header {
    display: flex;
    align-items: center;
    gap: 25px;
    margin-bottom: 25px;
}

.big-symbol {
    width: 120px;
    height: 120px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.big-symbol b {
    font-size: 50px;
}

.element-header h2 {
    color: #38bdf8;
    font-size: 35px;
}

.info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
}

.info-box {
    padding: 15px;
    background: #1e293b;
    border-radius: 10px;
    border-left: 4px solid #38bdf8;
}

.info-box strong {
    display: block;
    color: #38bdf8;
    margin-bottom: 5px;
}

.description {
    margin-top: 20px;
    padding: 20px;
    background: #1e293b;
    border-radius: 10px;
    line-height: 1.6;
}

@media(max-width:700px) {
    header h1 {
        font-size: 28px;
    }

    .element-header {
        flex-direction: column;
        text-align: center;
    }
}
</style>
</head>

/*
===========================================
DRAW TABLE
===========================================
*/

function drawTable() {

    table.innerHTML = "";

    elements.forEach((e,index) => {

        const symbol = e[0];
        const name = e[1];
        const number = e[2];
        const mass = e[3];
        const category = e[4];
        const group = e[5];
        const period = e[6];

        let column = group;
        let row = period;

        if (specialPositions[number]) {

            column = specialPositions[number][0];
            row = specialPositions[number][1] + 2;

        } else {

            if (period === 6 && group >= 3) {
                return;
            }

            if (period === 7 && group >= 3) {
                return;
            }

        }

        const div = document.createElement("div");

        div.className = "element " + category;

        div.style.gridColumn = column;
        div.style.gridRow = row;

        div.dataset.number = number;
        div.dataset.name = name.toLowerCase();
        div.dataset.symbol = symbol.toLowerCase();

        div.innerHTML = `
            <div class="number">${number}</div>
            <div class="symbol">${symbol}</div>
            <div class="name">${name}</div>
            <div class="mass">${mass}</div>
        `;

        div.onclick = function() {
            showElement(index);
        };

        table.appendChild(div);

    });

}

    const e = elements[index];

    const symbol = e[0];
    const name = e[1];
    const number = e[2];
    const mass = e[3];
    const category = e[4];
    const group = e[5];
    const period = e[6];
    const state = e[7];
    const electron = e[8];

    document.getElementById("details").classList.add("show");

    document.getElementById("bigNumber").textContent = number;

    document.getElementById("bigSymbolText").textContent = symbol;

    document.getElementById("detailName").textContent = name;

    document.getElementById("detailCategory").textContent =
        categoryName(category);

    document.getElementById("detailNumber").textContent = number;

    document.getElementById("detailSymbol").textContent = symbol;

    document.getElementById("detailMass").textContent =
        mass + " u";

    document.getElementById("detailGroup").textContent =
        group;

    document.getElementById("detailPeriod").textContent =
        period;

    document.getElementById("detailCategory2").textContent =
        categoryName(category);

    document.getElementById("detailState").textContent =
        state;

    document.getElementById("detailElectron").textContent =
        electron;

    document.getElementById("detailDescription").textContent =
        descriptions[symbol] || descriptions.default;

    document.getElementById("details").scrollIntoView({
        behavior:"smooth"
    });

}


/*
===========================================
CATEGORY NAMES
===========================================
*/

function categoryName(category) {

    const names = {

        alkali:"Alkali Metal",

        alkaline:"Alkaline Earth Metal",

        transition:"Transition Metal",

        post:"Post-transition Metal",

        metalloid:"Metalloid",

        nonmetal:"Nonmetal",

        halogen:"Halogen",

        noble:"Noble Gas",

        lanthanide:"Lanthanide",

        actinide:"Actinide"

    };

    return names[category] || category;

}


/*
===========================================
CLOSE
===========================================
*/

function closeDetails() {

    document.getElementById("details")
        .classList.remove("show");

}


/*
===========================================
SEARCH
===========================================
*/

function searchElements() {

    const query =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const cards =
        document.querySelectorAll(".element");

    cards.forEach(card => {

        const number =
            card.dataset.number;

        const name =
            card.dataset.name;

        const symbol =
            card.dataset.symbol;

        if (
            name.includes(query) ||
            symbol.includes(query) ||
            number === query
        ) {

            card.style.display = "block";

        } else {

            card.style.display = "none";

        }

    });

}
